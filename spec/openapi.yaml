openapi: 3.0.3
info:
  title: Vehicle Test-Fixture API (가상 스펙)
  version: 1.0.0
  description: >
    테스트 조건 세팅에 사용하는 "차량 상태 주입" 엔드포인트를 데모용으로 재구성한
    가상 스펙입니다. 필드명·경로·값은 실제 사내 API 와 무관하게 새로 정의했습니다.
servers:
  - url: http://127.0.0.1:4010
    description: local mock
  - url: https://vehicle-fixtures.alpha.example.test
    description: alpha
  - url: https://vehicle-fixtures.dev.example.test
    description: dev
paths:
  /test-fixtures/vehicles/{vehicle_id}:
    get:
      summary: 차량 상태 조회
      operationId: getVehicleState
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: 현재 차량 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleState'
    put:
      summary: 차량 상태값 주입 (테스트 조건 세팅)
      operationId: injectVehicleState
      description: >
        UI 조작 없이 요청 Payload 로 차량 상태를 직접 변경한다.
        전달한 필드만 부분 갱신(partial update)된다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleStateInput'
            examples:
              문열림:
                value: { door_state: OPEN }
              시동ON:
                value: { power_state: ON }
              배터리경계값:
                value: { charge_percent: 15 }
      responses:
        '200':
          description: 갱신된 차량 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleState'
        '401':
          description: 인증 실패
        '422':
          description: 유효하지 않은 상태값
components:
  parameters:
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: string
      example: FIXTURE-0001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    VehicleStateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        door_state:
          type: string
          enum: [OPEN, CLOSED]
        power_state:
          type: string
          enum: [ON, OFF]
        lock_state:
          type: string
          enum: [LOCKED, UNLOCKED]
        charge_percent:
          type: number
          minimum: 0
          maximum: 100
    VehicleState:
      type: object
      required:
        - vehicle_id
        - door_state
        - power_state
        - lock_state
        - charge_percent
        - updated_at
      properties:
        vehicle_id:
          type: string
        door_state:
          type: string
          enum: [OPEN, CLOSED]
        power_state:
          type: string
          enum: [ON, OFF]
        lock_state:
          type: string
          enum: [LOCKED, UNLOCKED]
        charge_percent:
          type: number
        updated_at:
          type: string
          format: date-time
